name: 'Restore Cache'

inputs:
  cache_path:
    description: 'Path where cache should be restored'
    required: true
    type: string

  cache_key:
    description: 'Primary key to restore cache'
    required: true
    type: string

  restore_keys:
    description: 'Multiline list of keys (fallback prefixes)'
    required: false
    default: ''

  cache_bucket:
    description: 'Legacy cache bucket, no longer used'
    required: false
    default: 'general-cache'

  debug:
    description: 'Enable Logs'
    required: false
    default: false

runs:
  using: 'composite'
  steps:
    - name: Restore GitHub Actions Cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.cache_path }}
        key: ${{ inputs.cache_key }}
        restore-keys: ${{ inputs.restore_keys }}