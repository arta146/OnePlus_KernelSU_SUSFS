name: 'Save Cache'

inputs:
  cache_path:
    description: 'Path where cache is saved'
    required: true
    type: string

  cache_key:
    description: 'Unique key for the cache'
    required: true
    type: string

  cache_bucket:
    description: 'Legacy cache bucket, no longer used'
    required: false
    default: 'general-cache'

  github_token:
    description: 'Legacy GitHub Token, no longer used'
    required: false

  compression_level:
    description: 'Legacy compression setting, no longer used'
    required: false
    default: '6'

  working_dir:
    description: 'Legacy working directory, no longer used'
    required: false

  delete_after_upload:
    description: 'Delete Source files after saving'
    required: false
    default: false

  debug:
    description: 'Enable Logs'
    required: false
    default: false

runs:
  using: 'composite'
  steps:
    - name: Save GitHub Actions Cache
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.cache_path }}
        key: ${{ inputs.cache_key }}

    - name: Delete Source Cache
      if: ${{ inputs.delete_after_upload == 'true' }}
      shell: bash
      run: |
        rm -rf "${{ inputs.cache_path }}"